# Render.com deployment configuration
services:
  - type: web
    name: doc-intelligence-api
    runtime: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      apt-get update && apt-get install -y tesseract-ocr
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doc-intelligence-db
          property: connectionString
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: CORS_ORIGINS
        value: https://your-app.streamlit.app,http://localhost:8501
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: HF_API_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: doc-intelligence-db
    plan: free
    databaseName: doc_intelligence
    user: docadmin
